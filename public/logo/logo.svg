<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Dark Blue/Navy Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0E2841"/>
      <stop offset="60%" stop-color="#071728"/>
      <stop offset="100%" stop-color="#030C16"/>
    </radialGradient>

    <!-- Metallic Gold Gradient for Main House & Accents -->
    <linearGradient id="goldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE195"/>
      <stop offset="25%" stop-color="#E2B254"/>
      <stop offset="55%" stop-color="#B88229"/>
      <stop offset="85%" stop-color="#DCA84B"/>
      <stop offset="100%" stop-color="#8C5B17"/>
    </linearGradient>

    <!-- Gold Gradient for Left Roof Beam Highlights -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3"/>
      <stop offset="50%" stop-color="#DDA143"/>
      <stop offset="100%" stop-color="#935E1B"/>
    </linearGradient>

    <!-- Dark Gold Shadow Gradient -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#915F1C"/>
      <stop offset="100%" stop-color="#4F2E07"/>
    </linearGradient>

    <!-- Outer Border Gold Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B3"/>
      <stop offset="35%" stop-color="#D19E42"/>
      <stop offset="70%" stop-color="#8C5C1C"/>
      <stop offset="100%" stop-color="#E8BC65"/>
    </linearGradient>

    <!-- Metallic Dark Teal/Blue Building Gradient -->
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4363"/>
      <stop offset="40%" stop-color="#0E2B43"/>
      <stop offset="100%" stop-color="#051422"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Internal 3D Depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Clip Path to ensure zero overflow outside rounded corners -->
    <clipPath id="roundedClip">
      <rect x="20" y="20" width="460" height="460" rx="90" ry="90"/>
    </clipPath>
  </defs>

  <!-- MAIN ICON CONTAINER (CLIPPED TO ROUNDED CORNERS) -->
  <g clip-path="url(#roundedClip)">
    <!-- Background Layer inside the rounded boundary -->
    <rect x="20" y="20" width="460" height="460" fill="url(#bgGrad)"/>

    <!-- LOGO EMBLEM GROUP WITH SHADOW -->
    <g filter="url(#dropShadow)">
      
      <!-- ================= SKYSCRAPERS (RIGHT SIDE) ================= -->
      <!-- Building 1 (Tallest Left Building in Group) -->
      <polygon points="238,198 238,138 335,76 335,320 238,300" fill="url(#buildingGrad)"/>
      <polygon points="263,185 280,174 280,300 263,295" fill="#588BAE" opacity="0.3"/>
      <polygon points="288,169 301,160 301,304 288,301" fill="#588BAE" opacity="0.3"/>
      <polygon points="335,76 335,320 342,315 342,83" fill="url(#goldMain)"/>

      <!-- Building 2 (Middle Tower - Gold Metallic) -->
      <polygon points="348,138 392,175 392,358 348,335" fill="url(#goldMain)"/>
      <polygon points="392,175 400,182 400,360 392,358" fill="url(#goldDark)"/>

      <!-- Building 3 (Far Right Tower) -->
      <polygon points="405,212 442,242 442,375 405,355" fill="url(#buildingGrad)"/>
      <polygon points="442,242 448,247 448,373 442,375" fill="url(#goldMain)"/>

      <!-- ================= HOUSE ROOF STRUCTURE ================= -->
      <!-- Left Roof Beam / Facet -->
      <polygon points="180,172 26,345 78,345 180,225" fill="url(#goldLight)"/>

      <!-- Main Right Roof Facet -->
      <polygon points="180,172 180,225 330,345 385,345" fill="url(#goldMain)"/>

      <!-- Apex 3D Depth Fold Shadow -->
      <polygon points="180,172 198,212 180,225" fill="url(#goldDark)"/>

      <!-- Golden Window Grid (4 Panes) -->
      <g fill="url(#goldMain)">
        <rect x="145" y="285" width="22" height="22" rx="2"/>
        <rect x="173" y="285" width="22" height="22" rx="2"/>
        <rect x="145" y="313" width="22" height="22" rx="2"/>
        <rect x="173" y="313" width="22" height="22" rx="2"/>
      </g>

      <!-- ================= SWOOPING BASE WAVE ================= -->
      <path d="M 30,395 
               C 110,408 200,345 350,350 
               C 410,352 445,372 462,398 
               C 400,365 330,348 240,352 
               C 150,356 80,400 30,395 Z" 
            fill="url(#goldMain)"/>

      <path d="M 30,395 
               C 120,410 220,355 365,358 
               C 415,360 445,378 462,398 
               C 410,378 355,362 260,364 
               C 160,366 85,405 30,395 Z" 
            fill="url(#goldLight)" opacity="0.6"/>

    </g>

    <!-- Inner Soft Bevel Border -->
    <rect x="25" y="25" width="450" height="450" rx="85" ry="85" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.15"/>
  </g>

  <!-- GOLD BORDER SHOWN EXACTLY ON THE EDGES (NO OUTSIDE AREA) -->
  <rect x="20" y="20" width="460" height="460" rx="90" ry="90" fill="none" stroke="url(#goldBorder)" stroke-width="8"/>
</svg>
